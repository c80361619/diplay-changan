plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 34

    defaultConfig {
        // KitKat port: Android 4.4.
        minSdk = 19
        targetSdk = 19

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                // NDK r26 is the last release that supports android-19 as a build platform.
                arguments 'APP_PLATFORM=android-19'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // NDK r26+ requires API 21+; r25c is the last release with android-19 crt objects.
    ndkVersion = '25.2.9519653'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
        // toHexString() is experimental in Kotlin 2.0's stdlib (stable from 2.2 upstream).
        freeCompilerArgs += '-opt-in=kotlin.ExperimentalStdlibApi'
    }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
